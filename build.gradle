import java.text.SimpleDateFormat

buildscript {
    ext {
        version_gradle_tools = "8.2.2"
        version_plugin_kotlin = "1.9.22"
        enable_plugin_kotlin = false

        version_compileSdk = 34
        version_buildTools = "34.0.0"
        version_minSdk = 31

    version_library_appcompat = "1.6.1"
    version_library_glide = "4.16.0"
}

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${version_gradle_tools}"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    tasks.matching {it instanceof Test}.all {
        testLogging.events "passed", "skipped", "failed", "standardOut", "standardError"
        testLogging.showStandardStreams = true
        reports.junitXml.required = true
        reports.html.required = true
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

static String findUsedAndroidLocales() {
    return '{"de", "en", "es", "fr", "it", "ru"}'
}

ext.getGitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return 'unknown'
    }
}

static String getBuildDate() {
    final SimpleDateFormat RFC3339_LIKE = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm'Z'")
    RFC3339_LIKE.setTimeZone(TimeZone.getTimeZone("UTC"))
    return RFC3339_LIKE.format(new Date())
}